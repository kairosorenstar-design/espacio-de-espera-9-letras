<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formando Palabras 9 Letras - Espacio de Anuncios</title>
<style>
  :root{
    --bg: #0b0f1a;
    --accent: #7f5af0;
    --accent2: #2cb67d;
    --text: #e6e6f0;
    --muted: #8a8aa3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
  }
  #screensaver{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(127,90,240,0.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(44,182,125,0.12), transparent 45%);
  }
  #grid{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(127,90,240,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,90,240,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(500px) rotateX(60deg);
    transform-origin: bottom;
    animation: gridMove 6s linear infinite;
    opacity:0.5;
  }
  @keyframes gridMove{
    from{background-position-y:0;}
    to{background-position-y:40px;}
  }
  #logo{
    position:fixed;
    width:70px;
    height:70px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:0 0 30px rgba(127,90,240,0.6);
    animation: bounce 9s linear infinite;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:12px;
    color:#fff;
    text-align:center;
  }
  @keyframes bounce{
    0%   { transform: translate(10vw, 10vh); }
    25%  { transform: translate(70vw, 15vh); }
    50%  { transform: translate(60vw, 65vh); }
    75%  { transform: translate(15vw, 60vh); }
    100% { transform: translate(10vw, 10vh); }
  }
  main{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:24px 16px 60px;
    gap:20px;
  }
  header{
    text-align:center;
    margin-bottom:4px;
  }
  header h1{
    font-size:clamp(1.2rem, 4vw, 1.8rem);
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    color: var(--muted);
    font-size:0.9rem;
    margin-top:4px;
  }
  .ad-slot{
    width:100%;
    max-width:320px;
    min-height:50px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  #ad-slot-native{
    max-width:728px;
    min-height:60px;
  }
  .ad-slot iframe{
    width:100%;
    height:100%;
    border:0;
  }
  .ad-slot span.placeholder{
    color:var(--muted);
    font-size:0.8rem;
  }
  #countdown-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  #countdown-circle{
    position:relative;
    width:110px;
    height:110px;
  }
  #countdown-circle svg{
    transform: rotate(-90deg);
    width:100%;
    height:100%;
  }
  #countdown-circle circle{
    fill:none;
    stroke-width:8;
  }
  .track{ stroke: rgba(255,255,255,0.08); }
  .progress{
    stroke: url(#gradStroke);
    stroke-linecap:round;
    transition: stroke-dashoffset 1s linear;
  }
  #countdown-number{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    font-weight:700;
  }
  #status-text{
    color:var(--muted);
    font-size:0.9rem;
    text-align:center;
  }
  #return-btn{
    margin-top:6px;
    padding:14px 36px;
    border-radius:999px;
    border:none;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color:#fff;
    opacity:0.35;
    pointer-events:none;
    transform: scale(0.97);
    transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
  }
  #return-btn.enabled{
    opacity:1;
    pointer-events:auto;
    transform: scale(1);
    box-shadow: 0 0 25px rgba(127,90,240,0.55);
  }
  #return-btn:active.enabled{
    transform: scale(0.97);
  }
  #adblock-overlay{
    position:fixed;
    inset:0;
    background:rgba(11,15,26,0.96);
    z-index:10;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  #adblock-overlay.show{ display:flex; }
  #adblock-overlay .box{
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #adblock-overlay h2{ color:#ff6b6b; }
  #adblock-overlay p{ color:var(--muted); font-size:0.9rem; }
  #adblock-overlay button{
    padding:12px 24px;
    border-radius:10px;
    border:none;
    background: var(--accent);
    color:#fff;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

  <div id="screensaver"></div>
  <div id="grid"></div>
  <div id="logo">9 LETRAS</div>

  <main>
    <header>
      <h1>Formando Palabras · 9 Letras</h1>
      <p>Gracias por apoyar el juego viendo este anuncio</p>
    </header>

    <div class="ad-slot" id="ad-slot-1" style="min-height:50px; max-width:320px;">
      <span class="placeholder">Cargando anuncio…</span>
    </div>

    <div class="ad-slot" id="ad-slot-native">
      <div id="container-934211ecfdb9be1f6e390d9b02c34867" style="width:100%;"></div>
    </div>

    <div class="ad-slot" id="ad-slot-2" style="min-height:300px; max-width:160px;">
      <span class="placeholder">Cargando anuncio…</span>
    </div>

    <div id="countdown-wrap">
      <div id="countdown-circle">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="gradStroke" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7f5af0"/>
              <stop offset="100%" stop-color="#2cb67d"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="60" cy="60" r="52"></circle>
          <circle class="progress" id="progressCircle" cx="60" cy="60" r="52"></circle>
        </svg>
        <div id="countdown-number">9</div>
      </div>
      <p id="status-text">Espera un momento antes de volver al juego…</p>
      <button id="return-btn">Volver a Formando Palabras</button>
    </div>
  </main>

<script>
  // ======= CONFIGURA AQUÍ LA URL DE REGRESO AL JUEGO =======
  const GAME_URL = "https://kairosorenstar-design.github.io/formando-palabras-9-letras/?formar=1";
  // ===========================================================

  const TOTAL_SECONDS = 9;
  const numberEl = document.getElementById('countdown-number');
  const progressEl = document.getElementById('progressCircle');
  const statusEl = document.getElementById('status-text');
  const btn = document.getElementById('return-btn');

  const RADIUS = 52;
  const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
  progressEl.style.strokeDasharray = CIRCUMFERENCE;
  progressEl.style.strokeDashoffset = 0;

  let remaining = TOTAL_SECONDS;
  let timerId = null;
  let paused = false;

  function tick(){
    if (paused) return;
    remaining--;
    if (remaining <= 0){
      finishCountdown();
      return;
    }
    numberEl.textContent = remaining;
    const offset = CIRCUMFERENCE * (1 - remaining / TOTAL_SECONDS);
    progressEl.style.strokeDashoffset = offset;
  }

  function finishCountdown(){
    clearInterval(timerId);
    numberEl.textContent = "✓";
    progressEl.style.strokeDashoffset = CIRCUMFERENCE;
    statusEl.textContent = "Ya puedes volver al juego";
    btn.classList.add('enabled');
  }

  function startCountdown(){
    timerId = setInterval(tick, 1000);
  }

  btn.addEventListener('click', () => {
    if (!btn.classList.contains('enabled')) return;
    window.location.href = GAME_URL;
  });

  // ---- Detección básica de bloqueador de anuncios (ya NO congela el contador) ----
  function detectAdBlock(callback){
    const bait = document.createElement('div');
    bait.className = 'adsbox ad-banner adsbygoogle';
    bait.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px;';
    document.body.appendChild(bait);
    window.setTimeout(() => {
      const blocked = bait.offsetParent === null || bait.clientHeight === 0;
      bait.remove();
      callback(blocked);
    }, 200);
  }

  // El contador SIEMPRE arranca. Si detecta bloqueador, solo muestra un aviso
  // pequeño y no bloqueante (no impide ver el botón ni volver al juego).
  startCountdown();

  detectAdBlock((blocked) => {
    if (blocked){
      statusEl.textContent = "Parece que tienes un bloqueador de anuncios activo";
    }
  });

  // ---- Carga de anuncios en iframes aislados (evita conflictos con document.write) ----
  function loadAdInIframe(containerId, adHtml){
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.setAttribute('scrolling', 'no');
    iframe.style.border = '0';
    container.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(adHtml);
    doc.close();
  }

  // Banner 320x50
  loadAdInIframe('ad-slot-1', `
    <html><body style="margin:0;background:transparent;display:flex;align-items:center;justify-content:center;">
      <script>
        atOptions = {
          'key' : 'b20e74038826b9191d385ae251395144',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      <\/script>
      <script src="https://www.highrevenueformat.com/b20e74038826b9191d385ae251395144/invoke.js"><\/script>
    </body></html>
  `);

  // Banner 160x300
  loadAdInIframe('ad-slot-2', `
    <html><body style="margin:0;background:transparent;display:flex;align-items:center;justify-content:center;">
      <script>
        atOptions = {
          'key' : '5093d26a3d5cba4bfbb4c51bef60fb10',
          'format' : 'iframe',
          'height' : 300,
          'width' : 160,
          'params' : {}
        };
      <\/script>
      <script src="https://www.highrevenueformat.com/5093d26a3d5cba4bfbb4c51bef60fb10/invoke.js"><\/script>
    </body></html>
  `);

  // ---- Carga de un <script> directamente en la página principal ----
  function loadScript(src, attrs){
    const s = document.createElement('script');
    s.src = src;
    if (attrs) Object.keys(attrs).forEach(k => s.setAttribute(k, attrs[k]));
    document.body.appendChild(s);
  }

  // Bandera nativa (se inyecta directo en su contenedor, no en iframe)
  loadScript('https://pl30128502.profitableratecpmnetwork.com/934211ecfdb9be1f6e390d9b02c34867/invoke.js', {
    'async': 'async',
    'data-cfasync': 'false'
  });

  // Barra social (flotante, se agrega sola a la página)
  loadScript('https://pl30128503.profitableratecpmnetwork.com/3d/83/41/3d83419eaf91b34808a8aa2d20daf013.js');

  // Ventana emergente (popunder): se activa con el primer clic en cualquier parte de la página
  loadScript('https://pl30128510.profitableratecpmnetwork.com/9b/b4/fe/9bb4fe75f6f876fc728809f8c1ddb4dd.js');
</script>
</body>
</html>
